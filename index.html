<!doctype html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('weather-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else if(t!=='system')document.documentElement.setAttribute('data-theme','dark')}catch{}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071522">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sky Report">
  <meta name="description" content="A weather.gov-powered forecast dashboard that auto-detects your location, refreshes automatically, and lets you switch to any US location.">
  <link rel="canonical" href="https://tylerbridges.github.io/">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sky Report">
  <meta property="og:title" content="Sky Report">
  <meta property="og:description" content="A weather.gov-powered forecast dashboard that auto-detects your location, refreshes automatically, and lets you switch to any US location.">
  <meta property="og:url" content="https://tylerbridges.github.io/">
  <meta property="og:image" content="https://tylerbridges.github.io/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sky Report">
  <meta name="twitter:description" content="A weather.gov-powered forecast dashboard that auto-detects your location, refreshes automatically, and lets you switch to any US location.">
  <meta name="twitter:image" content="https://tylerbridges.github.io/og-image.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://api.weather.gov">
  <link rel="dns-prefetch" href="https://api.weather.gov">
  <link rel="preconnect" href="https://photon.komoot.io" crossorigin>
  <link rel="dns-prefetch" href="https://photon.komoot.io">
  <link rel="stylesheet" href="/assets/site.css">
  <title>Sky Report</title>
</head>
<body>
  <main class="shell">
    <header id="site-header"></header>
    <div class="page-head">
      <p class="kicker" id="kicker" style="display:none"></p>
      <h1 id="headline">Locating…</h1>
      <p class="last-updated hidden" id="updated" aria-live="polite"></p>
    </div>
    <div id="loading" class="loading" role="status" aria-live="polite">Refreshing from weather.gov…</div>
    <div id="error" class="error hidden" role="alert"></div>
    <div id="content" class="hidden">
      <section class="briefs" aria-label="Forecast highlights">
        <div id="today-card"></div>
        <div id="tomorrow-card"></div>
      </section>
      <p class="see-more"><a href="/forecast.html">See the full 7-day forecast →</a></p>
      <section aria-labelledby="charts-title"><h2 id="charts-title">Next 48 hours</h2><div class="charts"><figure class="chart"><h3>Temperature</h3><svg id="temp-chart" role="img" aria-label="Hourly temperature in degrees Fahrenheit"></svg></figure><figure class="chart"><h3>Precipitation probability</h3><svg id="pop-chart" role="img" aria-label="Hourly precipitation probability in percent"></svg></figure><figure class="chart"><h3>Wind and gusts</h3><svg id="wind-chart" role="img" aria-label="Hourly sustained wind and gusts in miles per hour"></svg><div class="legend"><span><i class="swatch" style="background:var(--green)"></i>Sustained</span><span><i class="swatch" style="background:var(--orange)"></i>Gust</span></div></figure></div></section>
    </div>
    <footer class="site-footer" id="site-footer"></footer>
  </main>
  <script src="/assets/weather-core.js"></script>
  <script>
  (()=>{
    const {el,resolveLocation,resolvePoint,json,observationHistory,emoji,local,maxWind,gridValues,kphToMph,cToF,
      dayKey,startOfDay,hourLabel,dayRows,uvForDate,humidityForDate,gustForDate,popForDate,extraDayMetrics,dayMetrics,metricsHTML,sunMetrics,
      findTodayPeriods,renderFutureCardHTML,loadTodayCard,mountHeader,mountFooter,mountPullToRefresh,mountLocationSwitcher,DEFAULT_LOC,
      tempValue,windValue,tempUnitLabel,windUnitLabel,hour12,scheduleAutoRefresh}=WX;
    let chartData=null,currentLoc=null;
    const header=mountHeader('today',()=>load());
    mountFooter();
    mountLocationSwitcher(()=>load());
    // METARs land a few minutes either side of the hour, so each reading is
    // filed under the hour it sits closest to, and the closest one wins.
    // The chart’s own hour marks carry a sub-second offset (startOfDay keeps
    // the current milliseconds), so both sides get rounded the same way.
    const hourKey=ms=>Math.round(ms/3600000)*3600000;
    function observedValues(readings,pick,times){
      if(!readings?.length)return times.map(()=>null);
      const byHour=new Map();
      readings.forEach(reading=>{
        const at=Date.parse(reading.timestamp);
        if(!Number.isFinite(at))return;
        const hour=hourKey(at),gap=Math.abs(at-hour),held=byHour.get(hour);
        if(!held||gap<held.gap)byHour.set(hour,{reading,gap});
      });
      return times.map(time=>{const held=byHour.get(hourKey(time.getTime()));if(!held)return null;const value=pick(held.reading);return Number.isFinite(value)?value:null});
    }
    const obsTemp=o=>{const v=o.temperature?.value;return v==null?null:o.temperature.unitCode?.includes('degC')?cToF(v):Math.round(v)};
    const obsWind=o=>{const v=o.windSpeed?.value;return v==null?null:o.windSpeed.unitCode?.includes('km_h')?kphToMph(v):Math.round(v)};
    // A null gust is not missing data — it means nothing gusted above the
    // sustained wind, so that hour's peak is the sustained reading.
    const obsGust=o=>{const v=o.windGust?.value;return v==null?obsWind(o):o.windGust.unitCode?.includes('km_h')?kphToMph(v):Math.round(v)};
    function mergeChartSeries(history,nws,times,now){return times.map((time,index)=>time<now?(history[index]??nws[index]):(nws[index]??history[index]))}
    function draw(svg,series,domain,yTitle){
      const w=Math.max(320,svg.clientWidth||320),h=215,m={l:64,r:32,t:12,b:28},span=chartData.spanHours||48,
        x=i=>m.l+i*(w-m.l-m.r)/span,
        y=v=>m.t+(domain[1]-v)*(h-m.t-m.b)/(domain[1]-domain[0]),
        ns='http://www.w3.org/2000/svg';
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML='';
      const make=(parent,tag,a,t)=>{const n=document.createElementNS(ns,tag);Object.entries(a||{}).forEach(([k,v])=>n.setAttribute(k,v));if(t!=null)n.textContent=t;parent.appendChild(n);return n};
      const add=(tag,a,t)=>make(svg,tag,a,t),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      const timeLabel=date=>new Intl.DateTimeFormat('en-US',{timeZone:chartData.tz,hour:'numeric',minute:'2-digit',hour12:hour12()}).format(date).replace(/\b(AM|PM)\b/g,value=>value.toLowerCase());
      const scrubLabel=(date,offset)=>`${offset<24?'Today':offset<48?'Tom':new Intl.DateTimeFormat('en-US',{timeZone:chartData.tz,weekday:'short'}).format(date)} · ${timeLabel(date)}`;
      add('rect',{x:m.l,y:m.t,width:w-m.l-m.r,height:h-m.t-m.b,fill:'none',stroke:css('--line')});
      for(let j=0;j<=4;j++){const v=domain[0]+(domain[1]-domain[0])*j/4,yy=y(v);add('text',{x:m.l-7,y:yy+4,'text-anchor':'end',fill:css('--muted'),'font-size':11},Math.round(v))}
      (chartData.timeTicks||[]).forEach(t=>{
        const xx=x(t.i);
        if(t.i>0&&t.i<span)add('line',{x1:xx,x2:xx,y1:m.t,y2:h-m.b,stroke:t.day?css('--line-strong'):css('--line'),'stroke-dasharray':t.day?'2,3':'1,4'});
        add('text',{x:xx,y:h-6,'text-anchor':'middle',fill:t.day?css('--blue'):css('--muted'),'font-size':10,'font-weight':t.day?700:500},t.label);
      });
      add('text',{x:12,y:(m.t+h-m.b)/2+4,'text-anchor':'start',fill:css('--muted'),'font-size':11},yTitle);
      series.forEach(s=>{let d='',on=false;s.values.forEach((v,i)=>{if(v==null){on=false;return}d+=(on?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';on=true});add('path',{d,fill:'none',stroke:css(s.color),'stroke-width':2.6,'stroke-linejoin':'round'})});
      const current=new Date(),nowOffset=(current-chartData.windowStart)/3600000;
      let currentMarker=null;
      if(nowOffset>=0&&nowOffset<=span){const nowX=x(nowOffset);currentMarker=add('g',{'aria-hidden':'true','pointer-events':'none'});make(currentMarker,'line',{x1:nowX,x2:nowX,y1:m.t,y2:h-m.b,stroke:css('--orange'),'stroke-dasharray':'2,3'});make(currentMarker,'text',{x:nowX+4,y:m.t+12,'text-anchor':'start',fill:css('--orange'),'font-size':10,'font-weight':700},timeLabel(current))}
      const scrubMarker=add('g',{'aria-hidden':'true','pointer-events':'none',display:'none'}),scrubLine=make(scrubMarker,'line',{y1:m.t,y2:h-m.b,stroke:css('--muted'),'stroke-dasharray':'2,3'}),scrubText=make(scrubMarker,'text',{y:m.t+12,fill:css('--muted'),'font-size':10,'font-weight':700});
      const hit=add('rect',{x:m.l,y:m.t,width:w-m.l-m.r,height:h-m.t-m.b,fill:'transparent','pointer-events':'all',cursor:'crosshair','aria-hidden':'true'});
      function showScrub(clientX){const bounds=svg.getBoundingClientRect(),px=(clientX-bounds.left)*w/bounds.width,offset=Math.max(0,Math.min(span,(px-m.l)*span/(w-m.l-m.r))),xx=x(offset),anchor=offset>span-8?'end':'start',date=new Date(chartData.windowStart.getTime()+offset*3600000);scrubLine.setAttribute('x1',xx);scrubLine.setAttribute('x2',xx);scrubText.setAttribute('x',xx+(anchor==='end'?-4:4));scrubText.setAttribute('text-anchor',anchor);scrubText.textContent=scrubLabel(date,offset);scrubMarker.removeAttribute('display');currentMarker?.setAttribute('display','none')}
      function restoreNow(){scrubMarker.setAttribute('display','none');currentMarker?.removeAttribute('display')}
      hit.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')showScrub(e.clientX)});
      hit.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')restoreNow()});
      let holdTimer=null,touchScrubbing=false,touchStart=null;
      hit.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const touch=e.touches[0],startX=touch.clientX;touchStart={x:startX,y:touch.clientY};clearTimeout(holdTimer);holdTimer=setTimeout(()=>{touchScrubbing=true;showScrub(startX);try{navigator.vibrate?.(10)}catch{}},350)},{passive:true});
      hit.addEventListener('touchmove',e=>{if(!touchStart||e.touches.length!==1)return;const touch=e.touches[0];if(!touchScrubbing&&Math.hypot(touch.clientX-touchStart.x,touch.clientY-touchStart.y)>10){clearTimeout(holdTimer);touchStart=null;return}if(touchScrubbing){e.preventDefault();showScrub(touch.clientX)}},{passive:false});
      const endTouchScrub=e=>{clearTimeout(holdTimer);if(touchScrubbing)e.preventDefault();touchScrubbing=false;touchStart=null;restoreNow()};
      hit.addEventListener('contextmenu',e=>{if(touchScrubbing)e.preventDefault()});
      hit.addEventListener('touchend',endTouchScrub,{passive:false});hit.addEventListener('touchcancel',endTouchScrub,{passive:false})
    }
    function redraw(){
      if(!chartData||!chartData.temp.length){['temp-chart','pop-chart','wind-chart'].forEach(id=>el(id).innerHTML='');return;}
      el('temp-chart').setAttribute('aria-label',`Hourly temperature in degrees ${tempUnitLabel()==='C'?'Celsius':'Fahrenheit'}`);
      el('wind-chart').setAttribute('aria-label',`Hourly sustained wind and gusts in ${windUnitLabel()==='mph'?'miles per hour':'kilometers per hour'}`);
      const tempSeries=chartData.temp.map(v=>v==null?null:tempValue(v)),temps=tempSeries.filter(v=>v!=null),maxT=Math.max(...temps,tempValue(80)),minT=Math.min(...temps,tempValue(30));
      draw(el('temp-chart'),[{values:tempSeries,color:'--blue'}],[Math.floor((minT-5)/5)*5,Math.ceil((maxT+5)/5)*5],`°${tempUnitLabel()}`);
      draw(el('pop-chart'),[{values:chartData.pop,color:'--cyan'}],[0,100],'%');
      const windSeries=chartData.wind.map(v=>v==null?null:windValue(v)),gustSeries=chartData.gust.map(v=>v==null?null:windValue(v)),vals=[...windSeries,...gustSeries].filter(v=>v!=null),maxW=Math.max(windValue(20),...vals);
      draw(el('wind-chart'),[{values:windSeries,color:'--green'},{values:gustSeries,color:'--orange'}],[0,Math.ceil((maxW+3)/5)*5],windUnitLabel());
    }
    let busy=false,lastLoad=0,hasLoaded=false;
    async function load(){if(busy)return;busy=true;lastLoad=Date.now();if(!hasLoaded){el('loading').classList.remove('hidden');el('error').classList.add('hidden');el('content').classList.add('hidden')}else{el('content').classList.add('refreshing')}try{
      const loc=await resolveLocation();currentLoc=loc;
      const {point,label,tz,officeId}=await resolvePoint(loc);
      header.setKicker('');el('headline').textContent=label;
      const windowStart=startOfDay(tz);
      const results=await Promise.allSettled([json(point.properties.forecast),json(point.properties.forecastHourly),json(point.properties.forecastGridData),observationHistory(point,windowStart)]);
      if(results[0].status!=='fulfilled')throw new Error('The current seven-day forecast is unavailable.');
      const forecast=results[0].value,hourly=results[1].value,grid=results[2].value||{properties:{}},observed=results[3].value||null;
      const now=new Date(),periods=forecast.properties.periods.filter(p=>new Date(p.endTime)>now);
      if(!periods.length||!forecast.properties.updateTime||now-new Date(forecast.properties.updateTime)>36*3600000)throw new Error('NWS forecast is stale or cannot be verified.');
      const hourlyFresh=hourly?.properties?.updateTime&&now-new Date(hourly.properties.updateTime)<36*3600000;
      const hourlyPeriods=hourlyFresh?hourly.properties.periods:[];
      const times=Array.from({length:49},(_,i)=>new Date(windowStart.getTime()+i*3600000));
      const hours=times.map(t=>hourlyPeriods.find(p=>t>=new Date(p.startTime)&&t<new Date(p.endTime))||null);
      const rows=dayRows(forecast.properties.periods,grid,tz,loc.lat);
      const today=findTodayPeriods(forecast.properties.periods,tz);
      const todayTitle=`${emoji((today.day||today.night).shortForecast)} Today · ${now.toLocaleDateString('en-US',{timeZone:tz,month:'short',day:'numeric'})}`;
      await loadTodayCard(el('today-card'),todayTitle,loc,point,officeId,today,grid,tz);
      const tomorrow=rows[1];
      if(tomorrow){
        const tomorrowTitle=`${emoji((tomorrow.day||tomorrow.night).shortForecast)} Tomorrow · ${tomorrow.date.toLocaleDateString('en-US',{timeZone:tz,month:'short',day:'numeric'})}`;
        const tomorrowKey=dayKey(tz,tomorrow.date);
        const tomorrowMetrics=metricsHTML([...dayMetrics(tomorrow.day,tomorrow.night,uvForDate(tomorrowKey,loc.lat),humidityForDate(grid,tomorrowKey,tz),gustForDate(grid,tomorrowKey,tz),tomorrow.hi,tomorrow.lo,popForDate(grid,tomorrowKey,tz)).slice(1),...sunMetrics(tomorrow.date,loc.lat,loc.lon,tz),...extraDayMetrics(grid,tomorrowKey,tz)]);
        el('tomorrow-card').innerHTML=renderFutureCardHTML(tomorrowTitle,tomorrow.day,tomorrow.night,tomorrowMetrics,tomorrow.hi,tomorrow.lo);
      }else{el('tomorrow-card').innerHTML=renderFutureCardHTML('Tomorrow',null,null,'')}
      const gridTemp=gridValues(grid.properties.temperature,times,v=>grid.properties.temperature.uom?.includes('degC')?cToF(v):Math.round(v));
      const gridPop=gridValues(grid.properties.probabilityOfPrecipitation,times,v=>Math.round(v));
      const gridWind=gridValues(grid.properties.windSpeed,times,v=>grid.properties.windSpeed.uom?.includes('km_h')?kphToMph(v):Math.round(v));
      const gridGust=gridValues(grid.properties.windGust,times,v=>grid.properties.windGust.uom?.includes('km_h')?kphToMph(v):Math.round(v));
      const nwsTemp=hours.map((hour,index)=>hour?.temperature??gridTemp[index]),nwsPop=hours.map((hour,index)=>hour?.probabilityOfPrecipitation?.value??gridPop[index]),nwsWind=hours.map((hour,index)=>hour?maxWind(hour.windSpeed):gridWind[index]);
      // Observations cover temperature and wind for the elapsed hours. There
      // is no observed equivalent of a precipitation *probability*, so that
      // chart just starts wherever NWS grid data begins.
      const temp=mergeChartSeries(observedValues(observed,obsTemp,times),nwsTemp,times,now),pop=nwsPop,wind=mergeChartSeries(observedValues(observed,obsWind,times),nwsWind,times,now),gust=mergeChartSeries(observedValues(observed,obsGust,times),gridGust,times,now);
      const timeTicks=Array.from({length:9},(_,n)=>{const i=n*6;return{i,label:i===0?'Today':i===24?'Tom':i===48?new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short'}).format(times[i]):hourLabel(times[i],tz),day:i%24===0}});
      chartData={temp,pop,wind,gust,timeTicks,windowStart,tz,spanHours:48};
      el('updated').textContent=`Updated ${local(now,tz)}`;el('updated').classList.remove('hidden');
      el('loading').classList.add('hidden');el('content').classList.remove('hidden');requestAnimationFrame(redraw);hasLoaded=true;
    }catch(e){
      if(!hasLoaded){el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent=e.message}
    }finally{busy=false;el('content').classList.remove('refreshing')}}
    function autoRefresh(){if(document.visibilityState==='visible'&&Date.now()-lastLoad>5*60000)load()}
    window.addEventListener('pageshow',e=>{if(e.persisted)load()});
    document.addEventListener('visibilitychange',autoRefresh);
    document.addEventListener('timezonechange',()=>load());
    // load(), not redraw(): redraw() only repaints the three charts, which
    // left the today/tomorrow cards and the "Updated" line in the previous
    // units until the next manual reload — showing °F and °C at once.
    document.addEventListener('unitschange',()=>load());
    window.addEventListener('focus',autoRefresh);
    scheduleAutoRefresh(()=>{if(document.visibilityState==='visible')load()});
    setInterval(()=>{if(document.visibilityState==='visible')redraw()},60000);
    mountPullToRefresh(load);
    let chartWidth=0;new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width>0&&width!==chartWidth){chartWidth=width;requestAnimationFrame(redraw)}}).observe(document.querySelector('.charts'));window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',redraw);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();
  })();
  </script>
</body>
</html>
