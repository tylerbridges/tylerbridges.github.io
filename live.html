<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071522">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rochester Weather">
  <meta name="description" content="A weather.gov-powered forecast dashboard that auto-detects your location, refreshes automatically, and lets you switch to any US location.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://api.weather.gov">
  <link rel="dns-prefetch" href="https://api.weather.gov">
  <link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>
  <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org">
  <link rel="stylesheet" href="/assets/site.css">
  <title>Rochester Weather</title>
</head>
<body>
  <main class="shell">
    <header id="site-header"></header>
    <div class="page-head">
      <p class="kicker" id="kicker" style="display:none"></p>
      <h1 id="headline">Locating…</h1>
    </div>
    <div id="loading" class="loading" role="status" aria-live="polite">Refreshing from weather.gov…</div>
    <div id="error" class="error hidden" role="alert"></div>
    <div id="content" class="hidden">
      <section class="briefs" aria-label="Forecast highlights">
        <div id="today-card"></div>
        <div id="tomorrow-card"></div>
      </section>
      <p class="see-more"><a href="/forecast.html">See the full 7-day forecast →</a></p>
      <section aria-labelledby="charts-title"><h2 id="charts-title">Next 48 hours</h2><div class="charts"><figure class="chart"><h3>Temperature</h3><svg id="temp-chart" role="img" aria-label="Hourly temperature in degrees Fahrenheit"></svg><div class="legend"><span><i class="swatch" style="background:var(--blue)"></i>Temperature</span></div></figure><figure class="chart"><h3>Precipitation probability</h3><svg id="pop-chart" role="img" aria-label="Hourly precipitation probability in percent"></svg><div class="legend"><span><i class="swatch" style="background:var(--cyan)"></i>Probability</span></div></figure><figure class="chart"><h3>Wind and gusts</h3><svg id="wind-chart" role="img" aria-label="Hourly sustained wind and gusts in miles per hour"></svg><div class="legend"><span><i class="swatch" style="background:var(--green)"></i>Sustained</span><span><i class="swatch" style="background:var(--orange)"></i>Gust</span></div></figure></div></section>
      <p class="status" id="updated"></p>
      <p class="install">On iPhone: open this page in Safari, tap Share, then Add to Home Screen.</p>
      <div id="site-footer-nav"></div>
    </div>
  </main>
  <script src="/assets/weather-core.js"></script>
  <script>
  (()=>{
    const {el,resolveLocation,resolvePoint,json,emoji,local,maxWind,gridValues,kphToMph,
      dayKey,hourLabel,dayRows,uvForDate,humidityForDate,gustForDate,dayMetrics,metricsHTML,
      findTodayPeriods,renderFutureCardHTML,loadTodayCard,mountHeader,mountFooterNav,mountPullToRefresh,DEFAULT_LOC}=WX;
    let chartData=null,currentLoc=null;
    const header=mountHeader('today',()=>load());
    mountFooterNav('today');
    function draw(svg,series,domain,yTitle){const w=Math.max(320,svg.clientWidth||320),h=195,m={l:48,r:12,t:12,b:35},x=i=>m.l+i*(w-m.l-m.r)/47,y=v=>m.t+(domain[1]-v)*(h-m.t-m.b)/(domain[1]-domain[0]),ns='http://www.w3.org/2000/svg';svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML='';const add=(tag,a,t)=>{const n=document.createElementNS(ns,tag);Object.entries(a||{}).forEach(([k,v])=>n.setAttribute(k,v));if(t!=null)n.textContent=t;svg.appendChild(n);return n};const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();add('rect',{x:m.l,y:m.t,width:w-m.l-m.r,height:h-m.t-m.b,fill:'none',stroke:css('--line')});for(let j=0;j<=4;j++){const v=domain[0]+(domain[1]-domain[0])*j/4,yy=y(v);add('text',{x:m.l-7,y:yy+4,'text-anchor':'end',fill:css('--muted'),'font-size':11},Math.round(v))}const allTicks=chartData.tickIndices||[];(w<440?allTicks.filter(i=>chartData.labels[i]==='12a'||chartData.labels[i]==='12p'):allTicks).forEach(i=>{const midnight=chartData.labels[i]==='12a';add('text',{x:x(i),y:h-11,'text-anchor':i<3?'start':i>44?'end':'middle','font-weight':midnight?700:400,fill:css(midnight?'--text':'--muted'),'font-size':11},chartData.labels[i]||'')});add('text',{x:11,y:(m.t+h-m.b)/2,transform:`rotate(-90 11 ${(m.t+h-m.b)/2})`,'text-anchor':'middle',fill:css('--muted'),'font-size':11},yTitle);series.forEach(s=>{let d='',on=false;s.values.forEach((v,i)=>{if(v==null){on=false;return}d+=(on?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';on=true});add('path',{d,fill:'none',stroke:css(s.color),'stroke-width':2.6,'stroke-linejoin':'round'})})}
    function redraw(){if(!chartData||!chartData.temp.length){['temp-chart','pop-chart','wind-chart'].forEach(id=>el(id).innerHTML='');return;}const temps=chartData.temp.filter(v=>v!=null),maxT=Math.max(...temps,80),minT=Math.min(...temps,30);draw(el('temp-chart'),[{values:chartData.temp,color:'--blue'}],[Math.floor((minT-5)/5)*5,Math.ceil((maxT+5)/5)*5],'°F');draw(el('pop-chart'),[{values:chartData.pop,color:'--cyan'}],[0,100],'%');const vals=[...chartData.wind,...chartData.gust].filter(v=>v!=null),maxW=Math.max(20,...vals);draw(el('wind-chart'),[{values:chartData.wind,color:'--green'},{values:chartData.gust,color:'--orange'}],[0,Math.ceil((maxW+3)/5)*5],'mph')}
    let busy=false,lastLoad=0,hasLoaded=false;
    async function load(){if(busy)return;busy=true;lastLoad=Date.now();if(!hasLoaded){el('loading').classList.remove('hidden');el('error').classList.add('hidden');el('content').classList.add('hidden')}else{el('content').classList.add('refreshing')}try{
      const loc=await resolveLocation();currentLoc=loc;
      const {point,label,tz,officeId}=await resolvePoint(loc);
      header.setKicker('');el('headline').textContent=label;
      const results=await Promise.allSettled([json(point.properties.forecast),json(point.properties.forecastHourly),json(point.properties.forecastGridData)]);
      if(results[0].status!=='fulfilled')throw new Error('The current seven-day forecast is unavailable.');
      const forecast=results[0].value,hourly=results[1].value,grid=results[2].value||{properties:{}};
      const now=new Date(),periods=forecast.properties.periods.filter(p=>new Date(p.endTime)>now);
      if(!periods.length||!forecast.properties.updateTime||now-new Date(forecast.properties.updateTime)>36*3600000)throw new Error('NWS forecast is stale or cannot be verified.');
      const windowStart=new Date(Math.floor(now.getTime()/3600000)*3600000);
      const hourlyFresh=hourly?.properties?.updateTime&&now-new Date(hourly.properties.updateTime)<36*3600000;
      const hourlyPeriods=hourlyFresh?hourly.properties.periods:[];
      const times=Array.from({length:48},(_,i)=>new Date(windowStart.getTime()+i*3600000));
      const hours=times.map(t=>hourlyPeriods.find(p=>t>=new Date(p.startTime)&&t<new Date(p.endTime))||null);
      const rows=dayRows(forecast.properties.periods,grid,tz);
      const today=findTodayPeriods(forecast.properties.periods,tz);
      const todayTitle=`${emoji((today.day||today.night).shortForecast)} Today · ${now.toLocaleDateString('en-US',{timeZone:tz,month:'short',day:'numeric'})}`;
      await loadTodayCard(el('today-card'),todayTitle,loc,point,officeId,today,grid,tz);
      const tomorrow=rows[1];
      if(tomorrow){
        const tomorrowTitle=`${emoji((tomorrow.day||tomorrow.night).shortForecast)} Tomorrow · ${tomorrow.date.toLocaleDateString('en-US',{timeZone:tz,month:'short',day:'numeric'})}`;
        const tomorrowKey=dayKey(tz,tomorrow.date);
        const tomorrowMetrics=metricsHTML(dayMetrics(tomorrow.day,tomorrow.night,uvForDate(grid,tomorrowKey,tz),humidityForDate(grid,tomorrowKey,tz),gustForDate(grid,tomorrowKey,tz)));
        el('tomorrow-card').innerHTML=renderFutureCardHTML(tomorrowTitle,tomorrow.day,tomorrow.night,tomorrowMetrics);
      }else{el('tomorrow-card').innerHTML=renderFutureCardHTML('Tomorrow',null,null,'')}
      const gust=gridValues(grid.properties.windGust,times,v=>grid.properties.windGust.uom?.includes('km_h')?kphToMph(v):Math.round(v));
      const labels=times.map(d=>hourLabel(d,tz));
      const tickIndices=labels.map((l,i)=>({l,i})).filter(o=>['12a','6a','12p','6p'].includes(o.l)).map(o=>o.i);
      chartData={temp:hours.map(x=>x?.temperature??null),pop:hours.map(x=>x?.probabilityOfPrecipitation?.value??null),wind:hours.map(x=>x?maxWind(x.windSpeed):null),gust,labels,tickIndices};
      el('updated').textContent=`Updated ${local(now,tz)} · ${label}`;
      el('loading').classList.add('hidden');el('content').classList.remove('hidden');requestAnimationFrame(redraw);hasLoaded=true;
    }catch(e){
      if(!hasLoaded){el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent=e.message}
    }finally{busy=false;el('content').classList.remove('refreshing')}}
    function autoRefresh(){if(document.visibilityState==='visible'&&Date.now()-lastLoad>5*60000)load()}
    window.addEventListener('pageshow',e=>{if(e.persisted)load()});
    document.addEventListener('visibilitychange',autoRefresh);
    window.addEventListener('focus',autoRefresh);
    setInterval(()=>{if(document.visibilityState==='visible')load()},10*60000);
    mountPullToRefresh(load);
    let chartWidth=0;new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width>0&&width!==chartWidth){chartWidth=width;requestAnimationFrame(redraw)}}).observe(document.querySelector('.charts'));window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',redraw);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();
  })();
  </script>
</body>
</html>
