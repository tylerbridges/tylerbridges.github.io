name: Weather verification
on:
  push:
    branches: [weather-outlook-recovery-139, main]
    paths:
      - index.html
      - app.js
      - wx-*.js
      - tools/weather*.cjs
      - .github/workflows/weather-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and forecast verification
        run: |
          for f in app.js wx-models.js wx-normalize.js wx-official.js wx-outlook.js wx-archive.js; do node --check "$f"; done
          node --test tools/weather_check.cjs
      - name: Install browser check tools
        run: |
          npm install --prefix "$RUNNER_TEMP/weather-qa" playwright
          "$RUNNER_TEMP/weather-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser checks with controlled GRIB2 fields
        run: |
          python -m http.server 8003 > "$RUNNER_TEMP/weather-server.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/weather-qa/node_modules" node tools/weather_browser.cjs
      - name: Browser checks with live weather
        run: NODE_PATH="$RUNNER_TEMP/weather-qa/node_modules" node tools/weather_live.cjs
      - name: Deep radar audit
        run: |
          pip install metpy xarray cfgrib eccodes scipy numpy
          python tools/radar_audit.py
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser check tools
        run: |
          npm install --prefix "$RUNNER_TEMP/weather-qa" playwright
          "$RUNNER_TEMP/weather-qa/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Confirm deployed version and live behavior
        run: NODE_PATH="$RUNNER_TEMP/weather-qa/node_modules" node tools/weather_live.cjs --production
      - name: More panel layout in Chromium and WebKit
        run: |
          python -m http.server 8003 > "$RUNNER_TEMP/weather-server.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/weather-qa/node_modules" node tools/weather_tools_layout.cjs --webkit
