<!doctype html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('weather-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else if(t!=='system')document.documentElement.setAttribute('data-theme','dark')}catch{}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071522">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Hourly weather forecast for your selected location.">
  <link rel="canonical" href="https://tylerbridges.github.io/hourly.html">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sky Report">
  <meta property="og:title" content="Hourly Forecast — Sky Report">
  <meta property="og:description" content="Hourly weather forecast for your selected location.">
  <meta property="og:url" content="https://tylerbridges.github.io/hourly.html">
  <meta property="og:image" content="https://tylerbridges.github.io/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hourly Forecast — Sky Report">
  <meta name="twitter:description" content="Hourly weather forecast for your selected location.">
  <meta name="twitter:image" content="https://tylerbridges.github.io/og-image.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://api.weather.gov">
  <link rel="dns-prefetch" href="https://api.weather.gov">
  <link rel="preconnect" href="https://photon.komoot.io" crossorigin>
  <link rel="dns-prefetch" href="https://photon.komoot.io">
  <link rel="stylesheet" href="/assets/site.css">
  <title>Hourly Forecast — Sky Report</title>
</head>
<body>
  <main class="shell">
    <header id="site-header"></header>
    <div class="page-head">
      <p class="kicker" id="kicker" hidden></p>
      <h1 id="headline">Locating…</h1>
      <p class="last-updated hidden" id="updated" aria-live="polite"></p>
    </div>
    <div id="loading" class="loading" role="status" aria-live="polite">Loading hourly forecast…</div>
    <div id="error" class="error hidden" role="alert"></div>
    <div id="content" class="hidden">
      <div class="hourly-days" id="hourly-days"></div>
    </div>
    <footer class="site-footer" id="site-footer"></footer>
  </main>
  <script src="/assets/weather-core.js"></script>
  <script>
  (()=>{
    const {el,esc,resolveLocation,resolvePoint,json,local,emoji,dayKey,maxWind,gridValues,kphToMph,hourlyUVEstimate,mountHeader,mountFooter,mountPullToRefresh,mountLocationSwitcher,fmtTemp,windValue,windUnitLabel,hour12,scheduleAutoRefresh}=WX;
    let busy=false,lastLoad=0,hasLoaded=false;
    const header=mountHeader('hourly',()=>load());
    mountFooter();
    mountLocationSwitcher(()=>load());
    const hourText=(value,tz)=>new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',hour12:hour12()}).format(new Date(value));
    // Shorten long NWS phrases so the condition fits beside the temperature on phones.
    const shortCondition=text=>String(text||'').replace(/\bThunderstorms?\b/gi,m=>/s$/i.test(m)?'T-storms':'T-storm').replace(/\s+And\s+/gi,' & ');
    function renderHours(periods,tz,gusts,uvValues){
      const current=new Date(),groups=[];
      periods.forEach((period,sourceIndex)=>{
        const key=dayKey(tz,period.startTime),last=groups[groups.length-1];
        const item={period,sourceIndex};
        if(last?.key===key)last.periods.push(item);else groups.push({key,date:new Date(period.startTime),periods:[item]});
      });
      return groups.map((group,groupIndex)=>{
        const day=groupIndex===0?'Today':groupIndex===1?'Tomorrow':new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long'}).format(group.date);
        const date=new Intl.DateTimeFormat('en-US',{timeZone:tz,month:'short',day:'numeric'}).format(group.date);
        const rows=group.periods.map(({period,sourceIndex})=>{
          const rain=period.probabilityOfPrecipitation?.value,sustained=maxWind(period.windSpeed),gust=gusts[sourceIndex],uv=uvValues[sourceIndex],start=new Date(period.startTime),end=new Date(period.endTime),isCurrent=current>=start&&current<end;
          const wind=sustained==null&&gust==null?null:`Wind/Gusts: ${sustained==null?'—':windValue(sustained)}/${gust==null?'—':windValue(gust)} ${windUnitLabel()}`,details=[rain==null?null:`Rain: ${Math.round(rain)}%`,wind,uv==null?null:`UV: ${Math.round(uv)}`].filter(Boolean).join(' · ');
          const progress=isCurrent?Math.max(0,Math.min(100,(current-start)/(end-start)*100)):0,tick=isCurrent?`<span class="hourly-current-tick" style="--hour-progress:${progress.toFixed(1)}%" aria-hidden="true"></span>`:'';
          return `<article class="hourly-row">${tick}<time class="hourly-time" datetime="${esc(period.startTime)}">${esc(hourText(period.startTime,tz))}</time><span class="hourly-icon" aria-hidden="true">${emoji(period.shortForecast)}</span><span class="hourly-summary"><span class="hourly-condition" title="${esc(period.shortForecast)}">${esc(shortCondition(period.shortForecast))}</span><span class="hourly-summary-divider" aria-hidden="true">·</span><span class="hourly-temp">${esc(fmtTemp(period.temperature))}</span></span><span class="hourly-meta">${esc(details)}</span></article>`;
        }).join('');
        return `<section class="hourly-day" aria-labelledby="hourly-day-${groupIndex}"><h2 id="hourly-day-${groupIndex}">${day} · ${date}</h2><div class="hourly-list">${rows}</div></section>`;
      }).join('');
    }
    async function load(){if(busy)return;busy=true;lastLoad=Date.now();if(!hasLoaded){el('loading').classList.remove('hidden');el('error').classList.add('hidden');el('content').classList.add('hidden')}else{el('content').classList.add('refreshing')}try{
      const loc=await resolveLocation();
      const {point,label,tz}=await resolvePoint(loc);
      header.setKicker('');el('headline').textContent=label;
      const results=await Promise.allSettled([json(point.properties.forecastHourly),json(point.properties.forecastGridData)]),hourly=results[0].value,grid=results[1].value||{properties:{}},now=new Date();
      if(!hourly?.properties?.periods?.length||!hourly.properties.updateTime||now-new Date(hourly.properties.updateTime)>36*3600000)throw new Error('The hourly forecast is stale or unavailable.');
      const periods=hourly.properties.periods.filter(period=>new Date(period.endTime)>now).slice(0,48),times=periods.map(period=>new Date(period.startTime));
      const gusts=gridValues(grid.properties.windGust,times,value=>grid.properties.windGust.uom?.includes('km_h')?kphToMph(value):Math.round(value)),uvValues=times.map(time=>hourlyUVEstimate(time,loc.lat,loc.lon,tz));
      el('hourly-days').innerHTML=renderHours(periods,tz,gusts,uvValues);
      el('updated').textContent=`Updated ${local(now,tz)}`;el('updated').classList.remove('hidden');
      el('loading').classList.add('hidden');el('content').classList.remove('hidden');hasLoaded=true;
    }catch(e){if(!hasLoaded){el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent=e.message}}
    finally{busy=false;el('content').classList.remove('refreshing')}}
    function autoRefresh(){if(document.visibilityState==='visible'&&Date.now()-lastLoad>5*60000)load()}
    window.addEventListener('pageshow',e=>{if(e.persisted)load()});
    document.addEventListener('visibilitychange',autoRefresh);
    document.addEventListener('timezonechange',()=>load());
    document.addEventListener('unitschange',()=>load());
    window.addEventListener('focus',autoRefresh);
    scheduleAutoRefresh(()=>{if(document.visibilityState==='visible')load()});
    mountPullToRefresh(load);
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
    load();
  })();
  </script>
</body>
</html>
