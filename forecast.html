<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-iaGyl+MesImCrVNj4kQ20S4RvzBpRSK0LS5TGRYQTug=' 'sha256-vkHnbo+fQoKC9QYLm2WyUALZJofDOXB5tXPdTPa0JiA='; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://nowcoast.noaa.gov https://mesonet.agron.iastate.edu https://mapservices.weather.noaa.gov https://tiles.openfreemap.org; connect-src 'self' https://api.weather.gov https://photon.komoot.io https://nowcoast.noaa.gov https://mesonet.agron.iastate.edu https://mapservices.weather.noaa.gov https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <script>try{var t=localStorage.getItem('weather-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else if(t!=='system')document.documentElement.setAttribute('data-theme','dark')}catch{}</script>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071522">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Full 7-day NWS forecast for your location.">
  <link rel="canonical" href="https://tylerbridges.github.io/forecast.html">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sky Report">
  <meta property="og:title" content="7-Day Forecast — Sky Report">
  <meta property="og:description" content="Full 7-day NWS forecast for your location.">
  <meta property="og:url" content="https://tylerbridges.github.io/forecast.html">
  <meta property="og:image" content="https://tylerbridges.github.io/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="7-Day Forecast — Sky Report">
  <meta name="twitter:description" content="Full 7-day NWS forecast for your location.">
  <meta name="twitter:image" content="https://tylerbridges.github.io/og-image.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://api.weather.gov">
  <link rel="dns-prefetch" href="https://api.weather.gov">
  <link rel="preconnect" href="https://photon.komoot.io" crossorigin>
  <link rel="dns-prefetch" href="https://photon.komoot.io">
  <link rel="stylesheet" href="/assets/site.css">
  <title>7-Day Forecast — Sky Report</title>
</head>
<body>
  <main class="shell">
    <header id="site-header"></header>
    <div class="page-head">
      <p class="kicker" id="kicker" hidden></p>
      <h1 id="headline">Locating…</h1>
      <p class="last-updated hidden" id="updated" aria-live="polite"></p>
    </div>
    <div id="loading" class="loading" role="status" aria-live="polite">Loading forecast…</div>
    <div id="error" class="error hidden" role="alert"></div>
    <div id="content" class="hidden">
      <div id="today-card"></div>
      <div class="days" id="days"></div>
    </div>
    <footer class="site-footer" id="site-footer"></footer>
  </main>
  <script src="/assets/weather-core.js"></script>
  <script>
  (()=>{
    const {el,resolveLocation,resolvePoint,json,local,emoji,dayRows,findTodayPeriods,renderDaysHTML,loadTodayCard,mountHeader,mountFooter,mountPullToRefresh,mountLocationSwitcher,scheduleAutoRefresh,mountStatus,CACHE_TTL,renderDayNotes}=WX;
    let busy=false,lastLoad=0,hasLoaded=false;
    const header=mountHeader('forecast',()=>load());
    mountFooter();
    mountLocationSwitcher(()=>load());
    const status=mountStatus(()=>load());
    async function load(){if(busy)return;busy=true;lastLoad=Date.now();let loc=null;if(!hasLoaded){el('loading').classList.remove('hidden');el('error').classList.add('hidden');el('content').classList.add('hidden')}else{el('content').classList.add('refreshing')}try{
      loc=await resolveLocation();
      const {point,label,tz,officeId}=await resolvePoint(loc);
      header.setKicker('');el('headline').textContent=label;
      // Hourly feeds the per-day rain-timing and best-time notes; optional.
      const [grid,forecast,hourly]=await Promise.all([json(point.properties.forecastGridData,{ttl:CACHE_TTL.forecast}).catch(()=>({properties:{}})),json(point.properties.forecast,{ttl:CACHE_TTL.forecast}),json(point.properties.forecastHourly,{ttl:CACHE_TTL.forecast}).catch(()=>null)]);
      const now=new Date(),freshPeriods=forecast.properties.periods.filter(p=>new Date(p.endTime)>now);
      if(!freshPeriods.length||!forecast.properties.updateTime||now-new Date(forecast.properties.updateTime)>36*3600000)throw new Error('The NWS 7-day forecast is out of date or unavailable right now. Try again shortly.');
      const rows=dayRows(forecast.properties.periods,grid,tz,loc.lat);
      const today=findTodayPeriods(forecast.properties.periods,tz);
      const todayTitle=`${emoji((today.day||today.night).shortForecast)} Today · ${now.toLocaleDateString('en-US',{timeZone:tz,month:'short',day:'numeric'})}`;
      await loadTodayCard(el('today-card'),todayTitle,loc,point,officeId,today,grid,tz);
      el('days').innerHTML=renderDaysHTML(rows.slice(1),tz,loc);
      const hourlyFresh=hourly?.properties?.updateTime&&now-new Date(hourly.properties.updateTime)<36*3600000;
      renderDayNotes(el('content'),{hourly:hourlyFresh?hourly.properties.periods:null,rows,loc,tz,gridKey:point.properties.forecast});
      status.loaded({loc:{...loc,label},issued:forecast.properties.updateTime,tz});
      el('loading').classList.add('hidden');el('content').classList.remove('hidden');hasLoaded=true;
    }catch(e){status.failed(e,loc)}
    finally{busy=false;el('content').classList.remove('refreshing')}}
    function autoRefresh(){if(document.visibilityState==='visible'&&Date.now()-lastLoad>5*60000)load()}
    window.addEventListener('pageshow',e=>{if(e.persisted)load()});
    document.addEventListener('visibilitychange',autoRefresh);
    document.addEventListener('timezonechange',()=>load());
    document.addEventListener('unitschange',()=>load());
    window.addEventListener('focus',autoRefresh);
    scheduleAutoRefresh(()=>{if(document.visibilityState==='visible')load()});
    mountPullToRefresh(load);
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
    load();
  })();
  </script>
</body>
</html>
