<!doctype html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('weather-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else if(t!=='system')document.documentElement.setAttribute('data-theme','dark')}catch{}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071522">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Full 7-day NWS forecast for your location.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://api.weather.gov">
  <link rel="dns-prefetch" href="https://api.weather.gov">
  <link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>
  <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org">
  <link rel="stylesheet" href="/assets/site.css">
  <title>7-Day Forecast — Rochester Weather</title>
</head>
<body>
  <main class="shell">
    <header id="site-header"></header>
    <div class="page-head">
      <p class="kicker" id="kicker">Locating…</p>
      <h1>7-Day Forecast</h1>
    </div>
    <div id="loading" class="loading" role="status" aria-live="polite">Loading forecast…</div>
    <div id="error" class="error hidden" role="alert"></div>
    <div id="content" class="hidden">
      <div id="today-card"></div>
      <div class="days" id="days"></div>
      <p class="status" id="updated"></p>
    </div>
  </main>
  <script src="/assets/weather-core.js"></script>
  <script>
  (()=>{
    const {el,resolveLocation,resolvePoint,json,local,emoji,dayRows,findTodayPeriods,renderDaysHTML,loadTodayCard,mountHeader,mountPullToRefresh}=WX;
    let busy=false,lastLoad=0,hasLoaded=false;
    const header=mountHeader('forecast',()=>load());
    async function load(){if(busy)return;busy=true;lastLoad=Date.now();if(!hasLoaded){el('loading').classList.remove('hidden');el('error').classList.add('hidden');el('content').classList.add('hidden')}else{el('content').classList.add('refreshing')}try{
      const loc=await resolveLocation();
      const {point,label,tz,officeId}=await resolvePoint(loc);
      header.setKicker(label);
      const grid=await json(point.properties.forecastGridData).catch(()=>({properties:{}}));
      const forecast=await json(point.properties.forecast);
      const now=new Date(),freshPeriods=forecast.properties.periods.filter(p=>new Date(p.endTime)>now);
      if(!freshPeriods.length||!forecast.properties.updateTime)throw new Error('The 7-day forecast is unavailable.');
      const rows=dayRows(forecast.properties.periods,grid,tz,loc.lat);
      const today=findTodayPeriods(forecast.properties.periods,tz);
      const todayTitle=`${emoji((today.day||today.night).shortForecast)} Today · ${now.toLocaleDateString('en-US',{timeZone:tz,month:'short',day:'numeric'})}`;
      await loadTodayCard(el('today-card'),todayTitle,loc,point,officeId,today,grid,tz);
      el('days').innerHTML=renderDaysHTML(rows.slice(1),tz,loc);
      el('updated').textContent=`Forecast issued ${local(forecast.properties.updateTime,tz)} · Refreshed ${local(now,tz)}.`;
      el('loading').classList.add('hidden');el('content').classList.remove('hidden');hasLoaded=true;
    }catch(e){
      if(!hasLoaded){el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent=e.message}
    }finally{busy=false;el('content').classList.remove('refreshing')}}
    function autoRefresh(){if(document.visibilityState==='visible'&&Date.now()-lastLoad>5*60000)load()}
    window.addEventListener('pageshow',e=>{if(e.persisted)load()});
    document.addEventListener('visibilitychange',autoRefresh);
    document.addEventListener('timezonechange',()=>load());
    window.addEventListener('focus',autoRefresh);
    setInterval(()=>{if(document.visibilityState==='visible')load()},10*60000);
    mountPullToRefresh(load);
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
    load();
  })();
  </script>
</body>
</html>
