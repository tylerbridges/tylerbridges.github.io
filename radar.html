<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071522">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Live NOAA NEXRAD weather radar centered on your location.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://api.weather.gov">
  <link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://nowcoast.noaa.gov" crossorigin>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <title>Radar — Rochester Weather</title>
  <style>
    .radar-card{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);height:min(40vh,320px);min-height:240px;background:#000}
    #map{position:absolute;inset:0;background:#000}
    .radar-overlay{position:absolute;left:0;right:0;bottom:0;z-index:1000;display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem calc(env(safe-area-inset-bottom) + .65rem);background:color-mix(in srgb,var(--surface-2) 88%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line-strong)}
    .play-btn{flex:0 0 auto;width:36px;height:36px;border-radius:999px;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    .play-btn:active{transform:scale(.92)}
    .radar-overlay input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:999px;background:var(--line-strong);outline:none;margin:0}
    .radar-overlay input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:var(--line-strong)}
    .radar-overlay input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:var(--line-strong)}
    .radar-overlay input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer}
    .radar-overlay input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer}
    .radar-time{flex:0 0 auto;min-width:5rem;text-align:right;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
    .radar-legend{display:flex;align-items:center;gap:.55rem;margin-top:1rem;font-size:.78rem;color:var(--muted)}
    .legend-bar{flex:1;height:7px;border-radius:999px;background:linear-gradient(90deg,#4fc3f7,#66bb6a,#ffee58,#ffa726,#ef5350)}
    #radar-status{margin-top:.9rem}
    .leaflet-control-attribution{font-size:10px}
    .leaflet-control-zoom{border:0!important;box-shadow:var(--shadow)!important}
    .leaflet-control-zoom a{background:var(--surface)!important;color:var(--text)!important;border-color:var(--line)!important}
  </style>
</head>
<body>
  <main class="shell">
    <header id="site-header"></header>
    <div class="page-head">
      <p class="kicker" id="kicker">Locating…</p>
      <h1>Live Radar</h1>
    </div>
    <div id="loading" class="loading" role="status" aria-live="polite">Loading radar…</div>
    <div id="error" class="error hidden" role="alert"></div>
    <div id="content" class="hidden">
      <div class="radar-card">
        <div id="map"></div>
        <div class="radar-overlay">
          <button id="play-btn" class="play-btn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
          <input id="frame-slider" type="range" min="0" value="0" step="1" aria-label="Radar frame">
          <span id="radar-time" class="radar-time"></span>
        </div>
      </div>
      <div class="radar-legend" aria-hidden="true">
        <span>Light</span>
        <span class="legend-bar"></span>
        <span>Heavy</span>
      </div>
      <p class="status" id="radar-status"></p>
      <div id="site-footer-nav"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
  <script src="/assets/weather-core.js"></script>
  <script>
  (()=>{
    const {el,resolveLocation,mountHeader,mountFooterNav}=WX;
    const header=mountHeader('radar',()=>centerOnLocation());
    mountFooterNav('radar');
    // NOAA nowCoast time-enabled NEXRAD base reflectivity mosaic — run by NOAA/NWS.
    // weather.gov's own API (api.weather.gov) is JSON-only and has no radar imagery;
    // this is NOAA's official real-time GIS service for that data. NOAA has
    // restructured this exact service before, so a fallback candidate is kept
    // in case the primary URL is retired or reorganized again.
    const SERVICE_CANDIDATES=[
      'https://nowcoast.noaa.gov/arcgis/rest/services/nowcoast/radar_meteo_imagery_nexrad_time/MapServer',
      'https://idpgis.ncep.noaa.gov/arcgis/rest/services/NWS_Observations/radar_base_reflectivity/MapServer'
    ];
    let activeService=SERVICE_CANDIDATES[0];
    let map=null,marker=null,esriLayer=null,frames=[],idx=0,playing=true,timer=null;
    const PLAY_ICON='<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
    const PAUSE_ICON='<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';

    function fmtTime(ms){return new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
    function fmtFull(ms){return new Date(ms).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
    function updateStatus(checkedNow){
      if(!frames.length){el('radar-status').textContent='';return}
      const latest=frames[frames.length-1];
      el('radar-status').textContent=`Latest NOAA radar run: ${fmtFull(latest)}${checkedNow?' · just refreshed':''} · Source: NOAA/NWS NEXRAD base reflectivity`;
    }
    function showFrame(i){
      if(!frames.length)return;
      idx=((i%frames.length)+frames.length)%frames.length;
      el('frame-slider').value=idx;
      el('radar-time').textContent=idx===frames.length-1?`${fmtTime(frames[idx])} · latest`:fmtTime(frames[idx]);
      if(esriLayer)esriLayer.setTimeRange(new Date(frames[idx]),new Date(frames[idx]));
    }
    function play(){playing=true;el('play-btn').innerHTML=PAUSE_ICON;el('play-btn').setAttribute('aria-label','Pause');clearInterval(timer);timer=setInterval(()=>showFrame(idx+1),900)}
    function pause(){playing=false;el('play-btn').innerHTML=PLAY_ICON;el('play-btn').setAttribute('aria-label','Play');clearInterval(timer)}

    async function loadFrames(isRefresh){
      let info=null;
      for(const url of SERVICE_CANDIDATES){
        try{
          const meta=await fetch(`${url}?f=json`,{cache:'no-store'}).then(r=>r.json());
          if(meta.timeInfo?.timeExtent?.length){info=meta.timeInfo;activeService=url;break}
        }catch{}
      }
      if(!info)throw new Error('NOAA radar service did not report an available time range.');
      // esri-leaflet's RasterLayer has no setUrl(); rebuild the layer instead when
      // failover switches to the other NOAA service candidate.
      if(esriLayer&&!esriLayer.options.url.startsWith(activeService)){
        map.removeLayer(esriLayer);
        esriLayer=L.esri.dynamicMapLayer({url:activeService,opacity:0.85,f:'image',attribution:'Radar © <a href="https://www.weather.gov/" target="_blank" rel="noreferrer">NOAA/NWS</a>'}).addTo(map);
      }
      const [, end]=info.timeExtent;
      const stepMs=(info.timeInterval&&info.timeIntervalUnits==='esriTimeUnitsMinutes'?info.timeInterval:5)*60000;
      const spanMs=90*60000;
      const from=Math.max(info.timeExtent[0],end-spanMs);
      const list=[];
      for(let t=from;t<end;t+=stepMs)list.push(t);
      list.push(end);
      frames=list;
      el('frame-slider').max=frames.length-1;
      updateStatus(isRefresh);
      showFrame(frames.length-1);
    }

    function centerOnLocation(){
      if(typeof L==='undefined'){el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent='Map library failed to load. Check your connection and reload.';return}
      resolveLocation().then(async loc=>{
        header.setKicker(loc.label||'Your location');
        const latlng=[loc.lat,loc.lon];
        if(!map){
          el('loading').classList.add('hidden');el('content').classList.remove('hidden');
          map=L.map('map',{zoomControl:true,attributionControl:true}).setView(latlng,8);
          map.createPane('labels');map.getPane('labels').style.zIndex=450;map.getPane('labels').style.pointerEvents='none';
          // Esri's dark canvas basemap — a true black/dark-gray map (not satellite
          // imagery), keeping radar reflectivity colors high-contrast and easy to
          // read. Free, no API key required (unlike CARTO's dark tiles, which now
          // require one).
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Tiles © <a href="https://www.esri.com/" target="_blank" rel="noreferrer">Esri</a>'}).addTo(map);
          marker=L.marker(latlng).addTo(map);
          if(typeof L.esri==='undefined'){el('error').classList.remove('hidden');el('error').textContent='Radar map library (Esri-Leaflet) failed to load. Check your connection and reload.';return}
          esriLayer=L.esri.dynamicMapLayer({url:activeService,opacity:0.85,f:'image',attribution:'Radar © <a href="https://www.weather.gov/" target="_blank" rel="noreferrer">NOAA/NWS</a>'}).addTo(map);
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,pane:'labels'}).addTo(map);
          try{await loadFrames(false);if(playing)play()}catch(e){el('error').classList.remove('hidden');el('error').textContent=e.message}
          requestAnimationFrame(()=>map.invalidateSize());
        }else{
          map.setView(latlng,map.getZoom());
          marker.setLatLng(latlng);
        }
      }).catch(()=>{
        el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent='Could not resolve a location.';
      });
    }
    el('play-btn').addEventListener('click',()=>playing?pause():play());
    el('frame-slider').addEventListener('input',e=>{pause();showFrame(+e.target.value)});
    function refreshFrames(){if(map&&esriLayer)loadFrames(true).catch(()=>{})}
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFrames()});
    window.addEventListener('focus',refreshFrames);
    window.addEventListener('pageshow',e=>{if(e.persisted)refreshFrames()});
    window.addEventListener('resize',()=>{if(map)map.invalidateSize()});
    setInterval(()=>{if(document.visibilityState==='visible')refreshFrames()},5*60000);
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
    centerOnLocation();
  })();
  </script>
</body>
</html>
