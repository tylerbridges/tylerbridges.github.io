<!doctype html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('weather-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else if(t!=='system')document.documentElement.setAttribute('data-theme','dark')}catch{}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="High-resolution NEXRAD weather radar centered on your location.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://api.weather.gov">
  <link rel="preconnect" href="https://api.rainviewer.com" crossorigin>
  <link rel="preconnect" href="https://tilecache.rainviewer.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <title>Radar — Rochester Weather</title>
  <style>
    .radar-card{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--line-strong);box-shadow:var(--shadow);height:min(46vh,380px);min-height:260px;background:#000}
    #map{position:absolute;inset:0;background:#000}
    /* Page-local .radar-overlay would otherwise tie with .hidden on specificity
       and win on source order, keeping the bar visible when JS hides it. */
    .radar-overlay.hidden{display:none}
    .radar-overlay{position:absolute;left:0;right:0;bottom:0;z-index:1000;display:flex;align-items:center;gap:.55rem;padding:.32rem .5rem;background:color-mix(in srgb,var(--surface-2) 88%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line-strong)}
    .play-btn{flex:0 0 auto;width:28px;height:28px;border-radius:999px;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    .play-btn:active{transform:scale(.92)}
    .play-btn svg{width:12px;height:12px}
    .radar-overlay input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:999px;background:var(--line-strong);outline:none;margin:0}
    .radar-overlay input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:var(--line-strong)}
    .radar-overlay input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:var(--line-strong)}
    .radar-overlay input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer}
    .radar-overlay input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer}
    .radar-time{flex:0 0 auto;min-width:4rem;text-align:right;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
    .speed-btn{flex:0 0 auto;min-width:2.4rem;padding:.25rem .45rem;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--text);font-size:.72rem;font-weight:650}
    .speed-btn:active{transform:scale(.94)}
    .radar-legend{display:flex;align-items:center;gap:.55rem;margin-top:1rem;font-size:.78rem;color:var(--muted)}
    /* Mirrors the NEXRAD Level III reflectivity ramp the radar tiles use. */
    .legend-bar{flex:1;height:7px;border-radius:999px;background:linear-gradient(90deg,#04e9e7,#019ff4,#0300f4,#02fd02,#01c501,#008e00,#fdf802,#e5bc00,#fd9500,#fd0000,#bc0000,#f800fd)}
    #radar-status{margin-top:.9rem}
    .map-credit{margin-top:.55rem;font-size:.78rem;color:var(--muted)}
    .map-credit a{color:var(--blue)}
  </style>
</head>
<body>
  <main class="shell">
    <header id="site-header"></header>
    <div class="page-head">
      <p class="kicker" id="kicker">Locating…</p>
      <h1>Live Radar</h1>
    </div>
    <div id="loading" class="loading" role="status" aria-live="polite">Loading radar…</div>
    <div id="error" class="error hidden" role="alert"></div>
    <div id="content" class="hidden">
      <div class="radar-card">
        <div id="map"></div>
        <div class="radar-overlay">
          <button id="play-btn" class="play-btn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
          <input id="frame-slider" type="range" min="0" value="0" step="1" aria-label="Radar frame">
          <span id="radar-time" class="radar-time"></span>
          <button id="speed-btn" class="speed-btn" type="button" aria-label="Playback speed"></button>
        </div>
      </div>
      <div class="radar-legend" aria-hidden="true">
        <span>Light</span>
        <span class="legend-bar"></span>
        <span>Heavy</span>
      </div>
      <p class="status" id="radar-status"></p>
      <p class="map-credit"><a href="/credits.html">Map &amp; radar data credits</a></p>
      <div id="site-footer-nav"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="/assets/weather-core.js"></script>
  <script>
  (()=>{
    const {el,resolveLocation,resolvePoint,mountHeader,mountFooterNav,mountPullToRefresh,getTheme,recolorStyleDark}=WX;
    const header=mountHeader('radar',()=>centerOnLocation());
    mountFooterNav('radar');

    // RainViewer serves the same NEXRAD mosaic the NWS publishes, but as plain
    // XYZ tiles: 512px for retina sharpness, colour scheme 6 (NEXRAD Level III)
    // for the reflectivity ramp RadarScope users expect, smoothed, snow shown.
    const RV_INDEX='https://api.rainviewer.com/public/weather-maps.json';
    const TILE_SIZE=512,COLOR_SCHEME=6,TILE_OPTS='1_1';
    // Vector tiles stay sharp at any zoom and at the device's full pixel ratio,
    // which raster basemaps cannot do. Raster Esri is kept only as a fallback
    // for when the vector style cannot be reached.
    //
    // OpenFreeMap's own "dark" style is a fork of an abandoned upstream
    // project; "liberty" is their actively-maintained default (same tiles,
    // same CDN). recolorStyleDark() turns its light palette into a dark one
    // client-side, so the map tracks the site's light/dark theme using only
    // the maintained style, instead of depending on the unmaintained one.
    const VECTOR_STYLE='https://tiles.openfreemap.org/styles/liberty';
    // Attribution for all of these lives on /credits.html, linked below the
    // map, rather than on-map controls — see the note by attributionControl.
    const RASTER_FALLBACK={version:8,sources:{esri:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:16}},layers:[{id:'bg',type:'background',paint:{'background-color':'#000'}},{id:'esri',type:'raster',source:'esri'}]};

    let map=null,marker=null,frames=[],idx=0,playing=true,timer=null;
    let loading=false,onLatest=true,rvHost='',styleReady=false,usingFallback=false;
    // Playback speed: a multiplier on the base frame interval, remembered
    // per-device so a preference sticks across visits.
    const SPEED_KEY='radar-speed',SPEEDS=[0.5,1,2,3],BASE_INTERVAL=700;
    let speed=(()=>{try{const v=parseFloat(localStorage.getItem(SPEED_KEY));return SPEEDS.includes(v)?v:1}catch{return 1}})();
    function paintSpeedBtn(){el('speed-btn').textContent=`${speed}×`}
    const PLAY_ICON='<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
    const PAUSE_ICON='<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';

    const fmtTime=ms=>new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    const fmtFull=ms=>new Date(ms).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    const tileUrl=frame=>`${rvHost}${frame.path}/${TILE_SIZE}/{z}/{x}/{y}/${COLOR_SCHEME}/${TILE_OPTS}.png`;

    function updateStatus(checkedNow){
      if(!frames.length){el('radar-status').textContent='';return}
      el('radar-status').textContent=`Latest radar scan: ${fmtFull(frames[frames.length-1].time*1000)}${checkedNow?' · just refreshed':''} · NEXRAD mosaic via RainViewer`;
    }
    function paintFrame(){
      if(!map||!styleReady||!frames.length)return;
      const url=tileUrl(frames[idx]);
      const src=map.getSource('radar');
      if(src){src.setTiles([url]);return}
      map.addSource('radar',{type:'raster',tiles:[url],tileSize:TILE_SIZE});
      map.addLayer({id:'radar',type:'raster',source:'radar',paint:{'raster-opacity':.85,'raster-fade-duration':0}});
    }
    function showFrame(i){
      if(!frames.length)return;
      idx=((i%frames.length)+frames.length)%frames.length;
      onLatest=idx===frames.length-1;
      el('frame-slider').value=idx;
      el('radar-time').textContent=onLatest?`${fmtTime(frames[idx].time*1000)} · latest`:fmtTime(frames[idx].time*1000);
      paintFrame();
    }
    function play(){playing=true;el('play-btn').innerHTML=PAUSE_ICON;el('play-btn').setAttribute('aria-label','Pause');clearInterval(timer);timer=setInterval(()=>showFrame(idx+1),BASE_INTERVAL/speed)}
    function pause(){playing=false;el('play-btn').innerHTML=PLAY_ICON;el('play-btn').setAttribute('aria-label','Play');clearInterval(timer)}

    async function loadFrames(isRefresh){
      if(loading)return;
      loading=true;
      try{
        const data=await fetch(RV_INDEX,{cache:'no-store'}).then(r=>r.json());
        const past=data?.radar?.past||[];
        if(!data?.host||!past.length)throw new Error('no frames');
        rvHost=data.host;
        frames=past.slice(-13);
        el('frame-slider').max=frames.length-1;
        document.querySelector('.radar-overlay').classList.remove('hidden');
        el('error').classList.add('hidden');
        updateStatus(isRefresh);
        // Hold position when the viewer deliberately scrubbed back; only follow
        // the newest scan for someone already watching the live edge.
        showFrame(onLatest?frames.length-1:Math.min(idx,frames.length-1));
        if(playing&&!timer)play();
      }catch(e){
        clearInterval(timer);timer=null;
        frames=[];
        document.querySelector('.radar-overlay').classList.add('hidden');
        el('radar-status').textContent='';
        el('error').classList.remove('hidden');
        el('error').textContent='Radar imagery is unavailable right now. The map still works — pull down to retry.';
      }finally{loading=false}
    }

    function onStyleReady(){
      styleReady=true;
      // setStyle() discards layers, so the radar layer is re-added per style.
      paintFrame();
    }
    // Cache the fetched liberty style JSON so switching themes only recolors
    // it locally, without a second network round trip.
    let libertyStyle=null;
    async function themedStyle(){
      if(usingFallback)return RASTER_FALLBACK;
      if(!libertyStyle)libertyStyle=await fetch(VECTOR_STYLE,{cache:'no-store'}).then(r=>r.json());
      return getTheme()==='dark'?recolorStyleDark(libertyStyle):libertyStyle;
    }
    async function buildMap(latlng){
      let initialStyle;
      try{initialStyle=await themedStyle()}
      catch{usingFallback=true;initialStyle=RASTER_FALLBACK}
      map=new maplibregl.Map({
        container:'map',style:initialStyle,center:[latlng[1],latlng[0]],zoom:8,
        // No on-map attribution control — credited instead on a linked
        // /credits.html page so the map stays visually clean. All required
        // attributions (RainViewer, OpenFreeMap/OSM, Esri, MapLibre) live there.
        attributionControl:false,dragRotate:false,pitchWithRotate:false,
        // Vector tiles are resolution-independent; render at the device's real
        // pixel ratio so the basemap is genuinely sharp rather than upscaled.
        pixelRatio:window.devicePixelRatio||1,
        // Skip the tile crossfade so panning feels immediate rather than
        // fading in (localIdeographFontFamily already defaults to locally
        // rendering CJK glyphs instead of fetching them over the network).
        fadeDuration:0,
        minZoom:3,maxZoom:14,cooperativeGestures:false,
        // Bound how many off-screen tiles MapLibre keeps warm; the radar map
        // is small and short-lived, so a large cache only costs memory.
        maxTileCacheSize:24,refreshExpiredTiles:false
      });
      map.touchZoomRotate.disableRotation();
      map.on('style.load',onStyleReady);
      // If the vector style can't be reached, fall back to raster rather than
      // leaving a black rectangle.
      map.on('error',e=>{
        const msg=String(e?.error?.message||'');
        if(!styleReady&&!usingFallback&&/style|sprite|glyphs|fetch|load/i.test(msg)){usingFallback=true;map.setStyle(RASTER_FALLBACK)}
      });
      setTimeout(()=>{if(!styleReady&&!usingFallback){usingFallback=true;map.setStyle(RASTER_FALLBACK)}},7000);
      marker=new maplibregl.Marker({color:'#0a84ff'}).setLngLat([latlng[1],latlng[0]]).addTo(map);
      document.addEventListener('themechange',async()=>{
        styleReady=false;
        try{map.setStyle(await themedStyle())}catch{}
      });
    }

    function centerOnLocation(){
      if(typeof maplibregl==='undefined'){el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent='Map library failed to load. Check your connection and reload.';return}
      resolveLocation().then(loc=>{
        header.setKicker(loc.label||'Locating…');
        resolvePoint(loc).then(({label})=>header.setKicker(label)).catch(()=>header.setKicker(loc.label||'Your location'));
        const latlng=[loc.lat,loc.lon];
        if(!map){
          el('loading').classList.add('hidden');el('content').classList.remove('hidden');
          buildMap(latlng);
          loadFrames(false);
        }else{
          map.easeTo({center:[latlng[1],latlng[0]]});
          marker.setLngLat([latlng[1],latlng[0]]);
        }
      }).catch(()=>{
        el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent='Could not resolve a location.';
      });
    }

    el('play-btn').addEventListener('click',()=>playing?pause():play());
    el('frame-slider').addEventListener('input',e=>{pause();showFrame(+e.target.value)});
    paintSpeedBtn();
    el('speed-btn').addEventListener('click',()=>{
      speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];
      try{localStorage.setItem(SPEED_KEY,speed)}catch{}
      paintSpeedBtn();
      if(playing)play();
    });
    let lastRefresh=0;
    function refreshFrames(force){
      if(!map)return Promise.resolve();
      // visibilitychange and focus both fire when returning to the tab; without
      // this guard every return costs two identical round trips.
      if(!force&&Date.now()-lastRefresh<30000)return Promise.resolve();
      lastRefresh=Date.now();
      return loadFrames(true);
    }
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFrames()});
    window.addEventListener('focus',()=>refreshFrames());
    window.addEventListener('pageshow',e=>{if(e.persisted)refreshFrames()});
    window.addEventListener('resize',()=>{if(map)map.resize()});
    setInterval(()=>{if(document.visibilityState==='visible')refreshFrames()},5*60000);
    mountPullToRefresh(()=>map?refreshFrames(true):centerOnLocation());
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
    centerOnLocation();
  })();
  </script>
</body>
</html>
