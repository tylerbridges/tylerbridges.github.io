<!doctype html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('weather-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else if(t!=='system')document.documentElement.setAttribute('data-theme','dark')}catch{}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="High-resolution NEXRAD weather radar centered on your location.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://api.weather.gov">
  <link rel="preconnect" href="https://mesonet.agron.iastate.edu" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <title>Radar — Rochester Weather</title>
  <style>
    .radar-viewer{overflow:hidden;border:1px solid #3a3a3c;border-radius:14px;background:#101012;box-shadow:var(--shadow)}
    .radar-card{position:relative;height:clamp(280px,58vw,520px);background:#000}
    #map{position:absolute;inset:0;background:#000}
    .radar-console.hidden{display:none}
    .radar-console{border-top:1px solid #343437;background:#151517;color:#f5f5f7}
    .radar-frame-row{display:flex;justify-content:flex-end;padding:.55rem .75rem .48rem}
    .radar-frame-kind{color:#8e8e93;font-size:.69rem;line-height:1.2;font-weight:400}
    .radar-frame-readout{display:flex;align-items:baseline;justify-content:flex-end;gap:.35rem;flex:0 0 auto;font-variant-numeric:tabular-nums}
    .radar-frame-divider{color:#6c6c70;font-size:.72rem;font-weight:400}
    .radar-time{font-size:.9rem;line-height:1.1;color:#fff;font-weight:700}
    .radar-scale{height:9px;background:linear-gradient(90deg,#00e400 0%,#00a800 18%,#ffff00 35%,#ffbf00 46%,#ff0000 58%,#d60000 70%,#ff00ff 82%,#9955c9 92%,#fff 100%);box-shadow:inset 0 1px rgba(255,255,255,.12)}
    .radar-overlay{display:flex;align-items:center;gap:.65rem;padding:.62rem .75rem .68rem;background:#111113}
    .play-btn{flex:0 0 auto;width:30px;height:28px;border-radius:9px;border:1px solid rgba(100,210,255,.45);background:rgba(100,210,255,.08);color:var(--cyan);display:flex;align-items:center;justify-content:center;transition:transform .15s ease-out,background-color .15s ease-out}
    .play-btn:active{transform:scale(.92)}
    .play-btn:hover,.play-btn:focus-visible{background:rgba(100,210,255,.16)}
    .play-btn svg{width:13px;height:13px}
    .radar-overlay input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:5px;border-radius:999px;background:#46464a;outline:none;margin:0}
    .radar-overlay input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:999px;background:#46464a}
    .radar-overlay input[type=range]::-moz-range-track{height:5px;border-radius:999px;background:#46464a}
    .radar-overlay input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;margin-top:-6.5px;border-radius:50%;background:var(--cyan);border:2px solid #111113;box-shadow:0 0 0 1px rgba(100,210,255,.5);cursor:pointer}
    .radar-overlay input[type=range]::-moz-range-thumb{width:18px;height:18px;border:2px solid #111113;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 1px rgba(100,210,255,.5);cursor:pointer}
    .radar-overlay input[type=range]:focus-visible{box-shadow:0 0 0 2px var(--cyan)}
    .speed-btn{flex:0 0 auto;height:28px;min-width:2.7rem;padding:0 .5rem;border-radius:9px;border:1px solid #3a3a3c;background:#1c1c1e;color:#ddd;font-size:.72rem;font-weight:650;transition:transform .15s ease-out,background-color .15s ease-out}
    .speed-btn:active{transform:scale(.94);background-color:rgba(255,255,255,.1)}
    .radar-locate-btn{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;padding:0;border:1px solid rgba(100,210,255,.45);border-radius:10px;background:rgba(17,17,19,.86);color:var(--cyan);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 9px rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s ease-out,background-color .15s ease-out}
    .radar-locate-btn:hover,.radar-locate-btn:focus-visible{background:rgba(35,35,38,.94)}
    .radar-locate-btn:active{transform:scale(.92)}
    .radar-locate-btn:disabled{opacity:.55}
    .radar-locate-btn svg{width:21px;height:21px}
    .radar-location-marker{width:17px;height:17px;border:3px solid #fff;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.3),0 2px 7px rgba(0,0,0,.65)}
    #radar-status{margin-top:.9rem}
    @media(max-width:520px){.radar-card{height:clamp(210px,54vw,280px)}.radar-frame-row{padding:.5rem .65rem .42rem}.radar-overlay{padding:.58rem .65rem .64rem;gap:.55rem}}
  </style>
</head>
<body>
  <main class="shell">
    <header id="site-header"></header>
    <div class="page-head">
      <p class="kicker" id="kicker">Locating…</p>
      <h1>Live Radar</h1>
    </div>
    <div id="loading" class="loading" role="status" aria-live="polite">Loading radar…</div>
    <div id="error" class="error hidden" role="alert"></div>
    <div id="content" class="hidden">
      <section class="radar-viewer" aria-label="Animated weather radar">
        <div class="radar-card">
          <div id="map"></div>
          <button id="radar-locate-btn" class="radar-locate-btn" type="button" aria-label="Center radar on current location"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <span id="radar-locate-status" class="sr-only" aria-live="polite"></span>
        </div>
        <div class="radar-console hidden">
          <div class="radar-frame-row">
            <div class="radar-frame-readout"><time id="radar-time" class="radar-time"></time><span class="radar-frame-divider" aria-hidden="true">|</span><span id="radar-frame-kind" class="radar-frame-kind"></span></div>
          </div>
          <div class="radar-overlay">
            <button id="play-btn" class="play-btn" type="button" aria-label="Play"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
            <input id="frame-slider" type="range" min="0" value="0" step="1" aria-label="Radar frame">
            <button id="speed-btn" class="speed-btn" type="button" aria-label="Playback speed"></button>
          </div>
          <div class="radar-scale" role="img" aria-label="Radar intensity from light to heavy precipitation"></div>
        </div>
      </section>
      <p class="status" id="radar-status"></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="/assets/weather-core.js"></script>
  <script>
  (()=>{
    const {el,geolocate,resolveLocation,resolvePoint,getTimeZone,mountHeader,mountPullToRefresh,minimalDarkRadarStyle}=WX;
    const header=mountHeader('radar',()=>centerOnLocation());

    // Iowa Environmental Mesonet's continuously updated CONUS N0Q mosaic uses
    // the standard NEXRAD reflectivity palette: green for light precipitation,
    // then yellow, orange, red and magenta as intensity increases. Historical
    // layers are exposed at five-minute offsets, preserving animation without
    // the blue-only palette imposed by RainViewer's current public API.
    const IEM_TILE_ROOT='https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0';
    const TILE_SIZE=256,SCAN_INTERVAL=5*60000;
    // Vector tiles stay sharp at any zoom and at the device's full pixel ratio,
    // which raster basemaps cannot do. Raster Esri is kept only as a fallback
    // for when the vector style cannot be reached.
    //
    // The radar basemap always renders in a minimal, near-black roads-only
    // style — like RadarScope/Apple Weather/MyRadar — regardless of the
    // site's own light/dark toggle, so reflectivity colors stay high-contrast
    // against it. minimalDarkRadarStyle() strips OpenFreeMap's actively
    // maintained "liberty" style (OpenMapTiles schema) down to background,
    // water, boundaries, a progressively detailed road hierarchy and labels.
    const VECTOR_STYLE='https://tiles.openfreemap.org/styles/liberty';
    // Attribution for all of these lives on /credits.html, linked below the
    // map, rather than on-map controls — see the note by attributionControl.
    const RASTER_FALLBACK={version:8,sources:{esri:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:16}},layers:[{id:'bg',type:'background',paint:{'background-color':'#000'}},{id:'esri',type:'raster',source:'esri'}]};

    const DEFAULT_ZOOM=7.2,MAP_MAX_ZOOM=16;
    let map=null,marker=null,frames=[],pastCount=0,idx=0,playing=false,timer=null;
    let loading=false,onLatest=true,styleReady=false,usingFallback=false;
    // Playback speed: a multiplier on the base frame interval, remembered
    // per-device so a preference sticks across visits.
    const SPEED_KEY='radar-speed',SPEEDS=[0.5,1,2,3],BASE_INTERVAL=700;
    // Fastest speed (3x) yields a ~233ms frame interval; keep the fade
    // comfortably under that so one frame finishes dissolving in before the
    // next one starts loading.
    const RADAR_FADE_MS=200;
    let speed=(()=>{try{const v=parseFloat(localStorage.getItem(SPEED_KEY));return SPEEDS.includes(v)?v:1}catch{return 1}})();
    function paintSpeedBtn(){el('speed-btn').textContent=`${speed}×`;el('speed-btn').setAttribute('aria-label',`Playback speed, ${speed} times`)}
    const PLAY_ICON='<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
    const PAUSE_ICON='<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';

    const fmtTime=ms=>new Date(ms).toLocaleTimeString([],{timeZone:getTimeZone(),hour:'numeric',minute:'2-digit'});
    const fmtFull=ms=>new Date(ms).toLocaleString([],{timeZone:getTimeZone(),month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
    const tileUrl=frame=>`${IEM_TILE_ROOT}/${frame.layer}/{z}/{x}/{y}.png`;

    function updateStatus(checkedNow){
      if(!frames.length){el('radar-status').textContent='';return}
      el('radar-status').textContent=`Latest radar scan: ${fmtFull(frames[pastCount-1].time*1000)}${checkedNow?' · just refreshed':''}`;
    }
    function paintFrame(){
      if(!map||!styleReady||!frames.length)return;
      const url=tileUrl(frames[idx]);
      const src=map.getSource('radar');
      if(src){src.setTiles([url]);return}
      map.addSource('radar',{type:'raster',tiles:[url],tileSize:TILE_SIZE,minzoom:3,maxzoom:MAP_MAX_ZOOM});
      // A non-zero fade duration dissolves each new frame's tiles in rather
      // than swapping instantly, which is what turns the loop into a smooth
      // animated "sweep" instead of a hard cut — kept under the shortest
      // frame interval (BASE_INTERVAL at the fastest speed) so it never
      // outlasts the frame it's fading into.
      const referenceLayer=(map.getStyle().layers||[]).find(layer=>layer.type==='line'||layer.type==='symbol');
      map.addLayer({id:'radar',type:'raster',source:'radar',paint:{'raster-opacity':1,'raster-fade-duration':RADAR_FADE_MS,'raster-resampling':'nearest'}},referenceLayer?.id);
    }
    function showFrame(i){
      if(!frames.length)return;
      idx=((i%frames.length)+frames.length)%frames.length;
      onLatest=idx===pastCount-1;
      el('frame-slider').value=idx;
      const label=fmtTime(frames[idx].time*1000);
      const kind=onLatest?'Latest scan':'Past scan';
      el('radar-time').textContent=label;
      el('radar-frame-kind').textContent=kind;
      el('frame-slider').setAttribute('aria-valuetext',`${label}, ${kind.toLowerCase()}`);
      paintFrame();
    }
    function play(){playing=true;el('play-btn').innerHTML=PAUSE_ICON;el('play-btn').setAttribute('aria-label','Pause');clearInterval(timer);timer=setInterval(()=>showFrame(idx+1),BASE_INTERVAL/speed)}
    function pause(){playing=false;el('play-btn').innerHTML=PLAY_ICON;el('play-btn').setAttribute('aria-label','Play');clearInterval(timer)}

    async function loadFrames(isRefresh){
      if(loading)return;
      loading=true;
      try{
        // Allow a short publication delay, then align the displayed scan times
        // with IEM's five-minute current/past mosaic layers.
        const latest=Math.floor((Date.now()-2*60000)/SCAN_INTERVAL)*SCAN_INTERVAL;
        frames=Array.from({length:12},(_,i)=>{
          const minutes=(11-i)*5;
          return {time:(latest-minutes*60000)/1000,layer:minutes?`nexrad-n0q-m${String(minutes).padStart(2,'0')}m`:'nexrad-n0q'};
        });
        pastCount=frames.length;
        el('frame-slider').max=frames.length-1;
        document.querySelector('.radar-console').classList.remove('hidden');
        el('error').classList.add('hidden');
        updateStatus(isRefresh);
        // Hold position when the viewer deliberately scrubbed back; only follow
        // the newest observed scan for someone already watching the live edge.
        showFrame(onLatest?pastCount-1:Math.min(idx,frames.length-1));
        if(playing&&!timer)play();
      }catch(e){
        clearInterval(timer);timer=null;
        frames=[];
        document.querySelector('.radar-console').classList.add('hidden');
        el('radar-status').textContent='';
        el('error').classList.remove('hidden');
        el('error').textContent='Radar imagery is unavailable right now. The map still works — pull down to retry.';
      }finally{loading=false}
    }

    function onStyleReady(){
      styleReady=true;
      // setStyle() discards layers, so the radar layer is re-added per style.
      paintFrame();
    }
    async function radarStyle(){
      if(usingFallback)return RASTER_FALLBACK;
      const libertyStyle=await fetch(VECTOR_STYLE,{cache:'no-store'}).then(r=>r.json());
      return minimalDarkRadarStyle(libertyStyle);
    }
    async function buildMap(latlng){
      let initialStyle;
      try{initialStyle=await radarStyle()}
      catch{usingFallback=true;initialStyle=RASTER_FALLBACK}
      map=new maplibregl.Map({
        container:'map',style:initialStyle,center:[latlng[1],latlng[0]],zoom:DEFAULT_ZOOM,
        // No on-map attribution control — credited instead on a linked
        // /credits.html page so the map stays visually clean. All required
        // attributions (IEM, OpenFreeMap/OSM, Esri, MapLibre) live there.
        attributionControl:false,dragRotate:false,pitchWithRotate:false,
        // Vector tiles are resolution-independent; render at the device's real
        // pixel ratio so the basemap is genuinely sharp rather than upscaled.
        pixelRatio:window.devicePixelRatio||1,
        // Skip the tile crossfade so panning feels immediate rather than
        // fading in (localIdeographFontFamily already defaults to locally
        // rendering CJK glyphs instead of fetching them over the network).
        fadeDuration:0,
        minZoom:3,maxZoom:MAP_MAX_ZOOM,cooperativeGestures:matchMedia('(pointer: coarse)').matches,
        // Bound how many off-screen tiles MapLibre keeps warm; the radar map
        // is small and short-lived, so a large cache only costs memory.
        maxTileCacheSize:24,refreshExpiredTiles:false
      });
      map.touchZoomRotate.disableRotation();
      map.on('style.load',onStyleReady);
      // If the vector style can't be reached, fall back to raster rather than
      // leaving a black rectangle.
      map.on('error',e=>{
        const msg=String(e?.error?.message||'');
        if(!styleReady&&!usingFallback&&/style|sprite|glyphs|fetch|load/i.test(msg)){usingFallback=true;map.setStyle(RASTER_FALLBACK)}
      });
      setTimeout(()=>{if(!styleReady&&!usingFallback){usingFallback=true;map.setStyle(RASTER_FALLBACK)}},7000);
      const markerEl=document.createElement('div');markerEl.className='radar-location-marker';markerEl.setAttribute('role','img');markerEl.setAttribute('aria-label','Selected location');
      marker=new maplibregl.Marker({element:markerEl,anchor:'center'}).setLngLat([latlng[1],latlng[0]]).addTo(map);
    }

    function centerOnLocation(){
      if(typeof maplibregl==='undefined'){el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent='Map library failed to load. Check your connection and reload.';return}
      resolveLocation().then(loc=>{
        header.setKicker(loc.label||'Locating…');
        resolvePoint(loc).then(({label})=>{header.setKicker(label);if(frames.length){updateStatus(false);showFrame(idx)}}).catch(()=>header.setKicker(loc.label||'Your location'));
        const latlng=[loc.lat,loc.lon];
        if(!map){
          el('loading').classList.add('hidden');el('content').classList.remove('hidden');
          buildMap(latlng);
          loadFrames(false);
        }else{
          map.easeTo({center:[latlng[1],latlng[0]]});
          marker.setLngLat([latlng[1],latlng[0]]);
        }
      }).catch(()=>{
        el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent='Could not resolve a location.';
      });
    }

    async function centerOnDevice(){
      const button=el('radar-locate-btn'),status=el('radar-locate-status');
      button.disabled=true;button.setAttribute('aria-busy','true');status.textContent='Finding current location…';
      try{
        const pos=await geolocate({enableHighAccuracy:true,maximumAge:0,timeout:10000}),latlng=[pos.lon,pos.lat];
        map.jumpTo({center:latlng,zoom:DEFAULT_ZOOM});
        marker.setLngLat(latlng);
        status.textContent='Radar centered on your current location.';
        resolvePoint(pos).then(({label})=>header.setKicker(label)).catch(()=>header.setKicker('Current location'));
      }catch{status.textContent='Current location is unavailable.'}
      finally{button.disabled=false;button.removeAttribute('aria-busy')}
    }

    el('play-btn').addEventListener('click',()=>playing?pause():play());
    el('radar-locate-btn').addEventListener('click',centerOnDevice);
    el('frame-slider').addEventListener('input',e=>{pause();showFrame(+e.target.value)});
    paintSpeedBtn();
    el('speed-btn').addEventListener('click',()=>{
      speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];
      try{localStorage.setItem(SPEED_KEY,speed)}catch{}
      paintSpeedBtn();
      if(playing)play();
    });
    document.addEventListener('timezonechange',()=>{if(frames.length){updateStatus(false);showFrame(idx)}});
    let lastRefresh=0;
    function refreshFrames(force){
      if(!map)return Promise.resolve();
      // visibilitychange and focus both fire when returning to the tab; without
      // this guard every return costs two identical round trips.
      if(!force&&Date.now()-lastRefresh<30000)return Promise.resolve();
      lastRefresh=Date.now();
      return loadFrames(true);
    }
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFrames()});
    window.addEventListener('focus',()=>refreshFrames());
    window.addEventListener('pageshow',e=>{if(e.persisted)refreshFrames()});
    window.addEventListener('resize',()=>{if(map)map.resize()});
    // IEM's mosaic updates every five minutes; polling every two catches a new
    // scan soon after publication without hammering the public tile service.
    setInterval(()=>{if(document.visibilityState==='visible')refreshFrames()},2*60000);
    mountPullToRefresh(()=>map?refreshFrames(true):centerOnLocation());
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
    centerOnLocation();
  })();
  </script>
</body>
</html>
