<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2545">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Live NOAA NEXRAD weather radar centered on your location.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://api.weather.gov">
  <link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://mapservices.weather.noaa.gov" crossorigin>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <title>Radar — Rochester Weather</title>
  <style>
    html,body{height:100%}
    body.radar-page{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
    .radar-head{width:min(920px,100%);margin:auto;padding:calc(env(safe-area-inset-top) + 1rem) max(1rem,env(safe-area-inset-right)) .5rem max(1rem,env(safe-area-inset-left));flex:0 0 auto}
    #map{flex:1;min-height:0;width:100%;background:var(--bg)}
    .radar-controls{flex:0 0 auto;display:flex;flex-direction:column;gap:.4rem;padding:.7rem 1rem calc(env(safe-area-inset-bottom) + .7rem);background:var(--surface);border-top:1px solid var(--line)}
    .radar-row{display:flex;align-items:center;gap:.7rem}
    .play-btn{flex:0 0 auto;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:1.1rem;display:flex;align-items:center;justify-content:center}
    .radar-row input[type=range]{flex:1;accent-color:var(--blue)}
    .radar-time{flex:0 0 auto;min-width:5.5rem;text-align:right;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
    #radar-status{margin:0}
    .leaflet-control-attribution{font-size:10px}
  </style>
</head>
<body class="radar-page">
  <div class="radar-head">
    <header id="site-header"></header>
    <div class="page-head">
      <p class="kicker" id="kicker">Locating…</p>
      <h1>Live Radar</h1>
    </div>
    <div id="loading" class="loading" role="status" aria-live="polite">Loading radar…</div>
    <div id="error" class="error hidden" role="alert"></div>
  </div>
  <div id="map" class="hidden"></div>
  <div id="radar-controls" class="radar-controls hidden">
    <div class="radar-row">
      <button id="play-btn" class="play-btn" type="button" aria-label="Pause">⏸️</button>
      <input id="frame-slider" type="range" min="0" value="0" step="1" aria-label="Radar frame">
      <span id="radar-time" class="radar-time"></span>
    </div>
    <p class="status" id="radar-status"></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
  <script src="/assets/weather-core.js"></script>
  <script>
  (()=>{
    const {el,resolveLocation,mountHeader}=WX;
    const header=mountHeader('radar',()=>centerOnLocation());
    // NOAA nowCoast time-enabled NEXRAD base reflectivity mosaic — run by NOAA/NWS.
    // weather.gov's own API (api.weather.gov) is JSON-only and has no radar imagery;
    // this is NOAA's official real-time GIS service for that data.
    const SERVICE='https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/MapServer';
    let map=null,marker=null,esriLayer=null,frames=[],idx=0,playing=true,timer=null;

    function fmtTime(ms){return new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
    function fmtFull(ms){return new Date(ms).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
    function updateStatus(checkedNow){
      if(!frames.length){el('radar-status').textContent='';return}
      const latest=frames[frames.length-1];
      el('radar-status').textContent=`Latest NOAA radar run: ${fmtFull(latest)}${checkedNow?' · just refreshed':''} · Source: NOAA nowCoast NEXRAD base reflectivity`;
    }
    function showFrame(i){
      if(!frames.length)return;
      idx=((i%frames.length)+frames.length)%frames.length;
      el('frame-slider').value=idx;
      el('radar-time').textContent=idx===frames.length-1?`${fmtTime(frames[idx])} · latest`:fmtTime(frames[idx]);
      if(esriLayer)esriLayer.setTimeRange(new Date(frames[idx]),new Date(frames[idx]));
    }
    function play(){playing=true;el('play-btn').textContent='⏸️';el('play-btn').setAttribute('aria-label','Pause');clearInterval(timer);timer=setInterval(()=>showFrame(idx+1),900)}
    function pause(){playing=false;el('play-btn').textContent='▶️';el('play-btn').setAttribute('aria-label','Play');clearInterval(timer)}

    async function loadFrames(isRefresh){
      const meta=await fetch(`${SERVICE}?f=json`,{cache:'no-store'}).then(r=>r.json());
      const info=meta.timeInfo;
      if(!info?.timeExtent?.length)throw new Error('NOAA radar service did not report an available time range.');
      const [, end]=info.timeExtent;
      const stepMs=(info.timeInterval&&info.timeIntervalUnits==='esriTimeUnitsMinutes'?info.timeInterval:5)*60000;
      const spanMs=90*60000;
      const from=Math.max(info.timeExtent[0],end-spanMs);
      const list=[];
      for(let t=from;t<end;t+=stepMs)list.push(t);
      list.push(end);
      frames=list;
      el('frame-slider').max=frames.length-1;
      updateStatus(isRefresh);
      showFrame(frames.length-1);
    }

    function centerOnLocation(){
      if(typeof L==='undefined'){el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent='Map library failed to load. Check your connection and reload.';return}
      resolveLocation().then(async loc=>{
        header.setKicker(loc.label||'Your location');
        const latlng=[loc.lat,loc.lon];
        if(!map){
          map=L.map('map',{zoomControl:true,attributionControl:true}).setView(latlng,8);
          const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
          L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark?'dark_all':'voyager'}/{z}/{x}/{y}{r}.png`,{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>, © <a href="https://carto.com/attributions" target="_blank" rel="noreferrer">CARTO</a>'}).addTo(map);
          marker=L.marker(latlng).addTo(map);
          el('loading').classList.add('hidden');el('map').classList.remove('hidden');el('radar-controls').classList.remove('hidden');
          if(typeof L.esri==='undefined'){el('error').classList.remove('hidden');el('error').textContent='Radar map library (Esri-Leaflet) failed to load. Check your connection and reload.';return}
          esriLayer=L.esri.dynamicMapLayer({url:SERVICE,opacity:0.75,f:'image',attribution:'Radar © <a href="https://www.weather.gov/" target="_blank" rel="noreferrer">NOAA/NWS</a> nowCoast'}).addTo(map);
          try{await loadFrames(false);if(playing)play()}catch(e){el('error').classList.remove('hidden');el('error').textContent=e.message}
        }else{
          map.setView(latlng,map.getZoom());
          marker.setLatLng(latlng);
        }
      }).catch(()=>{
        el('loading').classList.add('hidden');el('error').classList.remove('hidden');el('error').textContent='Could not resolve a location.';
      });
    }
    el('play-btn').addEventListener('click',()=>playing?pause():play());
    el('frame-slider').addEventListener('input',e=>{pause();showFrame(+e.target.value)});
    function refreshFrames(){if(map&&esriLayer)loadFrames(true).catch(()=>{})}
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFrames()});
    window.addEventListener('focus',refreshFrames);
    window.addEventListener('pageshow',e=>{if(e.persisted)refreshFrames()});
    setInterval(()=>{if(document.visibilityState==='visible')refreshFrames()},5*60000);
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
    centerOnLocation();
  })();
  </script>
</body>
</html>
